services:
  - type: web
    name: celebration-planner
    runtime: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_MS
        value: "45000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
