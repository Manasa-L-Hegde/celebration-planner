services:
  - type: web
    name: celebration-planner
    runtime: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BACKUP_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_MS
        value: "40000"
      - key: ENABLE_KEEP_ALIVE
        value: "1"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
